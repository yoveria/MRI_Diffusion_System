# Nginx config for MRI Diffusion System
#
# Copy to: /etc/nginx/sites-available/mri-diffusion
# Then:    ln -s /etc/nginx/sites-available/mri-diffusion /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 50M;

    # ---------- Frontend static files ----------
    root /opt/mri-diffusion-system/FrontEnd/mri-diffusion-system/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API reverse proxy ----------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CPU inference can take minutes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- Generated result images ----------
    location /static/ {
        alias /opt/mri-diffusion-system/BackEnd/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}
